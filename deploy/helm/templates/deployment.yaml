apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencloudops.fullname" . }}
  labels: {{- include "opencloudops.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "opencloudops.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: {{- include "opencloudops.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "opencloudops.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: opencloudops
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.telemetry.serviceName | quote }}
            - name: OCC_DEPLOY_ENV
              value: {{ .Values.telemetry.deployEnvironment | quote }}
            {{- if .Values.telemetry.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            # /ready loads the platform contract and the pattern catalog. A pod
            # whose contracts will not parse must not take traffic, even though
            # its process is perfectly alive.
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /app/logs
              subPath: logs
            - name: state
              mountPath: /app/memories
              subPath: memories
            - name: tmp
              mountPath: /tmp
            {{- if .Values.config.existingConfigMap }}
            - name: contracts
              mountPath: /app/platform/platform.yaml
              subPath: platform.yaml
            - name: contracts
              mountPath: /app/agent-graph.yaml
              subPath: agent-graph.yaml
            {{- end }}
      volumes:
        # Ephemeral by design: the audit trail and memory store belong in your
        # log pipeline and a real volume respectively. An emptyDir here means a
        # restart loses them, which is the honest default rather than a
        # PersistentVolume the chart silently provisions for you.
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.config.existingConfigMap }}
        - name: contracts
          configMap:
            name: {{ .Values.config.existingConfigMap }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
