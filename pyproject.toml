[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencloudops"
version = "0.1.0"
description = "Agentic-first cloud operations: grounded, guarded infrastructure-as-code and SRE setup from a resource graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "find-services-ai" }]
keywords = ["iac", "sre", "platform-engineering", "ai-agents", "terraform", "opentelemetry", "chatops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
]
dev = ["pytest>=8.0", "httpx2>=2.0", "ruff>=0.5"]
all = ["opencloudops[api,otel,dev]"]

[project.scripts]
occ = "opencloudops.cli:main"

[project.urls]
Homepage = "https://github.com/find-services-ai/OpenCloudOps"
Issues = "https://github.com/find-services-ai/OpenCloudOps/issues"

[tool.setuptools.packages.find]
include = ["opencloudops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
