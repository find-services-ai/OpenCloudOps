# Uniform CI for every find-services-ai repo. Self-detecting: it finds the
# Python / Node projects that exist and runs what is present, so the same file
# works in an empty repo and in a monorepo. Lint/type/build steps are advisory
# (continue-on-error) until a repo opts in to strict mode by setting the repo
# variable CI_STRICT=true -- the "ratchet" described in docs/PR_REVIEW_PLAYBOOK.md.
name: CI

on:
  pull_request:
  push:
    # feature branches get full CI on every push, before any PR exists
    branches: [main, 'claude/**', 'feature/**', 'fix/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STRICT: ${{ vars.CI_STRICT == 'true' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.d.outputs.python }}
      node: ${{ steps.d.outputs.node }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        shell: bash
        run: |
          prune='-path ./.git -prune -o -path "*/node_modules" -prune -o -path "*/.venv" -prune -o -path "*/venv" -prune -o -path ./ideas -prune -o'
          py=$(eval "find . -maxdepth 2 $prune \( -name pyproject.toml -o -name requirements.txt -o -name requirements-aios.txt \) -type f -print" | xargs -r -n1 dirname | sort -u | jq -R . | jq -sc .)
          nd=$(eval "find . -maxdepth 2 $prune -name package.json -type f -print" | xargs -r -n1 dirname | sort -u | jq -R . | jq -sc .)
          echo "python=${py:-[]}" >> "$GITHUB_OUTPUT"
          echo "node=${nd:-[]}" >> "$GITHUB_OUTPUT"
          echo "python projects: $py"; echo "node projects: $nd"

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: YAML parses
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob('**/*.y*ml', recursive=True):
              if '/node_modules/' in f or f.startswith('.git/'): continue
              try:
                  list(yaml.safe_load_all(open(f)))
              except Exception as e:
                  bad += 1; print(f'::error file={f}::{e}')
          sys.exit(1 if bad else 0)
          PY
      - name: Merge-conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> )' -- . ':!*.md' ':!*.lock' ; then
            echo '::error::unresolved merge-conflict markers'; exit 1; fi
      - name: actionlint
        continue-on-error: ${{ env.STRICT != 'true' }}
        run: |
          if [ -d .github/workflows ]; then
            docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
          fi
      - name: shellcheck
        continue-on-error: ${{ env.STRICT != 'true' }}
        run: |
          files=$(git ls-files '*.sh')
          [ -z "$files" ] || shellcheck -S warning $files
      - name: docker compose config
        run: |
          for f in $(git ls-files | grep -E '(^|/)(docker-)?compose[^/]*\.ya?ml$'); do
            d=$(dirname "$f")
            # compose files often reference a git-ignored .env; seed it from the example
            [ -f "$d/.env" ] || [ ! -f "$d/.env.example" ] || cp "$d/.env.example" "$d/.env"
            echo "validating $f"; docker compose -f "$f" config -q || exit 1
          done

  python:
    needs: detect
    if: needs.detect.outputs.python != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.python) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ${{ matrix.dir }}/requirements*.txt
            ${{ matrix.dir }}/pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip pytest pytest-asyncio ruff
          for r in requirements.txt requirements-aios.txt; do
            [ -f "$r" ] && pip install -r "$r"
          done
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e . || true; fi
      - name: Lint (ruff)
        continue-on-error: ${{ env.STRICT != 'true' }}
        run: ruff check .
      - name: Compile check
        run: python -m compileall -q -x '(^|/)(ideas|node_modules|\.venv|venv)/' .
      - name: Tests
        run: |
          set +e
          python -m pytest -q
          rc=$?
          # 5 == no tests collected: not a failure for repos that have none yet
          [ $rc -eq 5 ] && { echo '::notice::no tests collected'; exit 0; }
          exit $rc

  node:
    needs: detect
    if: needs.detect.outputs.node != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.node) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint
        continue-on-error: ${{ env.STRICT != 'true' }}
        run: npm run lint --if-present
      - name: Typecheck
        continue-on-error: ${{ env.STRICT != 'true' }}
        run: '[ -f tsconfig.json ] && npx --no-install tsc --noEmit || true'
      - name: Tests
        run: npm test --if-present
      - name: Build
        continue-on-error: ${{ env.STRICT != 'true' }}
        run: npm run build --if-present

  # Single stable check name to require in branch protection.
  ci-ok:
    if: always()
    needs: [detect, hygiene, python, node]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        run: |
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo '${{ toJSON(needs) }}' | jq -e '[.[].result] | all(. == "success" or . == "skipped")' >/dev/null
