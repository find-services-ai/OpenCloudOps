# Keeps the `needs-rebase` label truthful so conflicted PRs are visible without
# opening each one. Runs when main moves and when a PR is touched. Labels only:
# never comments, never pushes, never merges.
name: PR conflict labeler

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const LABEL = 'needs-rebase';
            try {
              await github.rest.issues.getLabel({owner, repo, name: LABEL});
            } catch (e) {
              await github.rest.issues.createLabel({owner, repo, name: LABEL, color: 'b60205',
                description: 'Branch conflicts with the base branch'});
            }
            const prs = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'open', per_page: 100});
            for (const p of prs) {
              let pr;
              for (let i = 0; i < 6; i++) {            // mergeable is computed lazily
                pr = (await github.rest.pulls.get({owner, repo, pull_number: p.number})).data;
                if (pr.mergeable !== null) break;
                await new Promise(r => setTimeout(r, 5000));
              }
              if (pr.mergeable === null) continue;
              const has = pr.labels.some(l => l.name === LABEL);
              if (pr.mergeable_state === 'dirty' && !has) {
                await github.rest.issues.addLabels({owner, repo, issue_number: p.number, labels: [LABEL]});
              } else if (pr.mergeable_state !== 'dirty' && has) {
                await github.rest.issues.removeLabel({owner, repo, issue_number: p.number, name: LABEL});
              }
            }
